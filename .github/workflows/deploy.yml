name: Wasp Deploy

# PRD-01 deploy-infra work (2026-09-16). Redeploys to Railway on every
# push to main. See docs/09-work-changelog.md for the full setup
# checklist -- this file alone isn't enough to run yet:
#   1. `wasp deploy railway launch licensedent` must be run once, manually,
#      to create the Railway project (this workflow only does
#      *re*-deploys, per Wasp's own docs).
#   2. RAILWAY_PROJECT_ID below must be filled in with the real ID from
#      that launch (Railway dashboard -> project -> Settings).
#   3. A RAILWAY_API_TOKEN repo secret must be added (Railway dashboard ->
#      https://railway.com/account/tokens -> generate without selecting a
#      workspace -> GitHub repo -> Settings -> Secrets and variables ->
#      Actions).
#   4. This repo needs an actual GitHub remote (none configured yet as of
#      this commit) for pushes to main to trigger anything.

on:
  # Both repos use `master` today; `main` is kept so a later rename to
  # `main` needs no workflow change (RAID I-01, 2026-09-24).
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  # Runs on every push and PR -- a typecheck gate before anything reaches
  # main, since previously nothing verified a change before `wasp deploy`
  # ran straight to production on push. No test step yet: there are no
  # test files in this repo (`src/**/*.test.ts(x)`) for vitest to run, so
  # a "test" step would be a vacuous pass, not real coverage -- add one
  # once real tests exist rather than fake the gate.
  verify:
    runs-on: ubuntu-latest
    env:
      WASP_VERSION: '0.25'
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.20.0'

      - name: Install dependencies
        run: npm install

      # `wasp/entities`, `wasp/client/operations`, etc. (imported all over
      # src/) only exist once Wasp generates .wasp/out/sdk -- node_modules/wasp
      # is a symlink into it, created by the Wasp CLI, not by `npm install`.
      # This job had no Wasp CLI step at all before 2026-09-25.
      - name: Install Wasp
        run: npm i -g @wasp.sh/wasp-cli@$WASP_VERSION

      # `wasp build` alone, as the very first Wasp command in a fresh
      # checkout, fails with "Cannot find module '.wasp/spec/dist/src/run.js'"
      # -- that bundle (Wasp's own *.wasp.ts analyzer) is only bootstrapped by
      # `wasp install`, confirmed 2026-09-25 across three fresh-clone
      # rehearsals (a leftover .wasp/spec from local dev had been masking
      # this every time it was tested against the existing WSL working copy).
      - name: Bootstrap Wasp project
        run: wasp install

      # Separately, `wasp build`'s own spec-analysis step type-checks
      # src/blog/blogBuildTimeData.ts, which imports `@prisma/client` --
      # but wasp build only generates that client *after* spec analysis
      # succeeds, a chicken-and-egg gap on a fresh checkout (no prior
      # `wasp start`/`prisma generate` to have already produced it).
      # Confirmed 2026-09-25: `wasp build` fails on this every time without
      # an explicit prior generate, succeeds every time with one.
      - name: Generate Prisma client
        run: npx prisma generate --schema=schema.prisma

      - name: Generate Wasp SDK
        run: wasp build

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.src.json

  deploy:
    needs: verify
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    env:
      WASP_VERSION: '0.25'
      RAILWAY_PROJECT_NAME: licensedent
      RAILWAY_PROJECT_ID: TODO_FILL_IN_AFTER_RAILWAY_LAUNCH

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.20.0'

      # This job went straight from checkout to the global Wasp CLI install,
      # never running `npm install` or `wasp install` in the project itself
      # -- same class of gap the `verify` job had, just surfaced here as
      # "Missing or stale dependencies in project: ... Run wasp install to
      # fix this" instead (confirmed via a real CI run, 2026-09-25) rather
      # than a raw module-not-found crash. Same fix as `verify` above.
      - name: Install dependencies
        run: npm install

      - name: Install Wasp
        run: npm i -g @wasp.sh/wasp-cli@$WASP_VERSION

      - name: Bootstrap Wasp project
        run: wasp install

      - name: Generate Prisma client
        run: npx prisma generate --schema=schema.prisma

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy
        run: wasp deploy railway deploy $RAILWAY_PROJECT_NAME --existing-project-id $RAILWAY_PROJECT_ID
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
